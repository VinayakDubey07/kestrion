# Generated by kestrion deploy --target k8s
# Review before applying. See comments for what to fill in.
#
# Apply with:
#   kubectl apply -f my-agent-k8s.yaml
#
# Prerequisites:
#   - A container image with your agent code (see Dockerfile below)
#   - The image pushed to a registry your cluster can pull from
#   - A Kubernetes namespace to deploy into

---
apiVersion: v1
kind: Namespace
metadata:
  name: default

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-agent-config
  namespace: default
data:
  KESTRION_MODEL: "claude-sonnet-4-6"
  KESTRION_STORE_URL: "sqlite:////data/agent.db"
  KESTRION_SYSTEM_PROMPT: ""

---
# IMPORTANT: Replace placeholder values with real secrets.
# Never commit real API keys to version control.
# Use a secrets manager (Vault, AWS Secrets Manager, etc.) in production.
apiVersion: v1
kind: Secret
metadata:
  name: my-agent-secrets
  namespace: default
type: Opaque
stringData:
  LLM_API_KEY: "REPLACE_WITH_REAL_KEY"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-agent
  namespace: default
  labels:
    app: my-agent
    managed-by: kestrion
spec:
  # 1 replica because SQLite is single-writer. Switch to Postgres and
  # increase this once kestrion[postgres] is available.
  replicas: 1
  selector:
    matchLabels:
      app: my-agent
  template:
    metadata:
      labels:
        app: my-agent
    spec:
      containers:
        - name: agent
          # Replace with your actual image:tag
          image: your-registry/my-agent:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: my-agent-config
            - secretRef:
                name: my-agent-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          # Mount a volume for the SQLite store if not using Postgres.
          # Remove this block when switching to a network-accessible store.
          volumeMounts:
            - name: store-volume
              mountPath: /data
      volumes:
        - name: store-volume
          # PersistentVolumeClaim for durable SQLite storage.
          # Change to emptyDir for ephemeral (state lost on pod restart).
          persistentVolumeClaim:
            claimName: my-agent-store-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: my-agent-store-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# Expose the agent if you've built an HTTP interface on top of it.
# Remove this if the agent runs as a background job with no HTTP surface.
apiVersion: v1
kind: Service
metadata:
  name: my-agent-svc
  namespace: default
spec:
  selector:
    app: my-agent
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
