<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kestrion — Developer Console</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg: #0b1329;
      --surface: #111b35;
      --surface-hover: #1c2a4f;
      --border: #23355f;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --accent: #0ea5e9;
      --accent-hover: #38bdf8;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --magenta: #d946ef;
      --font-sans: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .brand span {
      background: var(--border);
      color: var(--text-dim);
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    button {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button.btn-secondary {
      background: var(--border);
      color: var(--text);
    }

    button.btn-secondary:hover {
      background: var(--surface-hover);
    }

    button.btn-success {
      background: var(--green);
    }

    button.btn-success:hover {
      background: #059669;
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 320px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .search-box {
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 14px;
      width: 100%;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--accent);
    }

    .runs-list {
      flex: 1;
      overflow-y: auto;
    }

    .run-item {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s;
    }

    .run-item:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .run-item.active {
      background: var(--surface);
      border-left: 3px solid var(--accent);
    }

    .run-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .run-id {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 9999px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .badge.completed { background: rgba(16, 185, 129, 0.15); color: var(--green); }
    .badge.running { background: rgba(14, 165, 233, 0.15); color: var(--accent); }
    .badge.waiting_on_human { background: rgba(245, 158, 11, 0.15); color: var(--yellow); }
    .badge.failed { background: rgba(239, 68, 110, 0.15); color: var(--red); }
    .badge.expired { background: rgba(217, 70, 239, 0.15); color: var(--magenta); }

    .run-item-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-dim);
    }

    /* Detail view */
    .detail-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.1);
    }

    .detail-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 24px;
      flex-shrink: 0;
    }

    .detail-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .detail-run-id {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 700;
    }

    .detail-stats {
      display: flex;
      gap: 24px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 6px;
      min-width: 120px;
    }

    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 600;
      font-family: var(--font-mono);
    }

    /* Approval Banner */
    .approval-banner {
      background: rgba(245, 158, 11, 0.08);
      border: 1px dashed var(--yellow);
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .approval-title {
      font-weight: 600;
      color: var(--yellow);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
    }

    .approval-form {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .approval-input {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 12px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      width: 180px;
    }

    /* Timeline */
    .timeline-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .timeline {
      position: relative;
      padding-left: 24px;
      margin-left: 8px;
      border-left: 2px solid var(--border);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 24px;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -33px;
      top: 4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--surface);
      border: 3px solid var(--border);
    }

    .timeline-item.completed::before { border-color: var(--green); background: var(--bg); }
    .timeline-item.started::before { border-color: var(--accent); background: var(--bg); }
    .timeline-item.failed::before { border-color: var(--red); background: var(--bg); }
    .timeline-item.warning::before { border-color: var(--yellow); background: var(--bg); }

    .timeline-time {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .timeline-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .timeline-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .timeline-node {
      font-family: var(--font-mono);
      font-size: 11px;
      background: rgba(255,255,255,0.06);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-dim);
    }

    .timeline-payload {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-dim);
      background: rgba(0, 0, 0, 0.2);
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      white-space: pre-wrap;
      border: 1px solid rgba(255, 255, 255, 0.02);
    }

    .llm-metrics {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--accent);
      font-family: var(--font-mono);
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      gap: 16px;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      stroke: var(--border);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent);"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      <h1>Kestrion Console</h1>
      <span>v0.2.1</span>
    </div>
    <div class="header-actions">
      <button class="btn-secondary" onclick="loadRuns()">Refresh</button>
    </div>
  </header>

  <div class="container">
    <div class="sidebar">
      <div class="sidebar-header">
        <input type="text" id="search" class="search-box" placeholder="Filter runs..." oninput="filterRuns()">
      </div>
      <div class="runs-list" id="runs-list">
        <!-- Runs will be loaded here -->
      </div>
    </div>

    <div class="detail-view" id="detail-view">
      <div class="empty-state" id="empty-state">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
        <p>Select a run from the sidebar to inspect its execution trace</p>
      </div>

      <div class="detail-header" id="detail-header" style="display: none;">
        <div class="detail-header-top">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="detail-run-id" id="detail-run-id"></div>
            <span class="badge" id="detail-status"></span>
          </div>
          <div class="detail-stats">
            <div class="stat-card">
              <div class="stat-label">Total Cost</div>
              <div class="stat-value" id="detail-cost">$0.00</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Total Tokens</div>
              <div class="stat-value" id="detail-tokens">0</div>
            </div>
          </div>
        </div>

        <div class="approval-banner" id="approval-banner" style="display: none;">
          <div class="approval-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"/></svg>
            Human Approval Required
          </div>
          <p id="approval-description"></p>
          <div class="approval-form">
            <label for="approval-role" style="font-size: 13px; color: var(--text-dim);">Approving Role:</label>
            <input type="text" id="approval-role" class="approval-input" value="__any__">
            <button class="btn-success" onclick="approveRun()">Approve Tool Call</button>
          </div>
        </div>
      </div>

      <div class="timeline-container" id="timeline-container" style="display: none;">
        <div class="timeline" id="timeline">
          <!-- Events will be loaded here -->
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentRunId = null;
    let runsData = [];
    let pendingTool = null;

    async function loadRuns() {
      try {
        const res = await fetch('/api/runs');
        runsData = await res.json();
        renderRunsList();
        if (currentRunId) {
          loadRunDetails(currentRunId);
        }
      } catch (err) {
        console.error('Failed to load runs:', err);
      }
    }

    function renderRunsList() {
      const filter = document.getElementById('search').value.toLowerCase();
      const list = document.getElementById('runs-list');
      list.innerHTML = '';

      const filtered = runsData.filter(r => r.run_id.toLowerCase().includes(filter));

      if (filtered.length === 0) {
        list.innerHTML = '<div style="padding: 16px; text-align: center; color: var(--text-dim); font-size: 14px;">No runs found</div>';
        return;
      }

      filtered.forEach(run => {
        const item = document.createElement('div');
        item.className = `run-item ${run.run_id === currentRunId ? 'active' : ''}`;
        item.onclick = () => selectRun(run.run_id);

        const date = new Date(run.timestamp || Date.now()).toLocaleTimeString();

        item.innerHTML = `
          <div class="run-item-header">
            <span class="run-id">${run.run_id}</span>
            <span class="badge ${run.status}">${run.status}</span>
          </div>
          <div class="run-item-meta">
            <span>Tokens: ${run.total_tokens}</span>
            <span>Cost: $${(run.total_cost_usd || 0).toFixed(5)}</span>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function filterRuns() {
      renderRunsList();
    }

    function selectRun(runId) {
      currentRunId = runId;
      document.querySelectorAll('.run-item').forEach(el => el.classList.remove('active'));
      const activeEl = Array.from(document.querySelectorAll('.run-item')).find(el => el.querySelector('.run-id').innerText === runId);
      if (activeEl) activeEl.classList.add('active');

      document.getElementById('empty-state').style.display = 'none';
      document.getElementById('detail-header').style.display = 'block';
      document.getElementById('timeline-container').style.display = 'block';

      loadRunDetails(runId);
    }

    async function loadRunDetails(runId) {
      try {
        const runRes = await fetch(`/api/runs/${runId}`);
        const state = await runRes.json();

        document.getElementById('detail-run-id').innerText = state.run_id;
        
        const statusBadge = document.getElementById('detail-status');
        statusBadge.innerText = state.status;
        statusBadge.className = `badge ${state.status}`;

        document.getElementById('detail-cost').innerText = `$${(state.total_cost_usd || 0).toFixed(5)}`;
        document.getElementById('detail-tokens').innerText = state.total_tokens;

        // Approval gating checks
        const approvalBanner = document.getElementById('approval-banner');
        if (state.status === 'waiting_on_human') {
          const pending = state.scratch._pending_approval;
          if (pending) {
            pendingTool = pending.tool;
            document.getElementById('approval-description').innerHTML = `
              Tool <strong>${pending.tool}</strong> is waiting on approval.<br>
              <strong>Arguments:</strong> <code style="background: rgba(0,0,0,0.2); padding: 2px 4px; border-radius: 4px; font-family: var(--font-mono);">${JSON.stringify(pending.kwargs)}</code><br>
              <strong>Missing Roles:</strong> ${JSON.stringify(pending.missing_roles)}
            `;
            approvalBanner.style.display = 'flex';
          } else {
            approvalBanner.style.display = 'none';
          }
        } else {
          approvalBanner.style.display = 'none';
          pendingTool = null;
        }

        // Load timeline events
        const eventsRes = await fetch(`/api/runs/${runId}/events`);
        const events = await eventsRes.json();
        renderTimeline(events);
      } catch (err) {
        console.error('Failed to load details:', err);
      }
    }

    function renderTimeline(events) {
      const timeline = document.getElementById('timeline');
      timeline.innerHTML = '';

      events.forEach(evt => {
        const item = document.createElement('div');
        
        let typeClass = '';
        const type = evt.type;
        if (type.includes('started')) typeClass = 'started';
        else if (type.includes('completed')) typeClass = 'completed';
        else if (type.includes('failed') || type.includes('expired')) typeClass = 'failed';
        else if (type.includes('intervention')) typeClass = 'warning';

        item.className = `timeline-item ${typeClass}`;

        const date = new Date(evt.timestamp).toLocaleString();
        const payload = evt.payload;
        
        let headerText = evt.type.toUpperCase();
        let payloadContent = '';
        let extraInfo = '';

        if (type === 'message_received') {
          headerText = 'USER MESSAGE RECEIVED';
          payloadContent = payload.content;
        } else if (type === 'llm_call_completed') {
          headerText = 'LLM CALL COMPLETED';
          extraInfo = `
            <div class="llm-metrics">
              Stop Reason: ${payload.stop_reason || 'N/A'} | Tokens: ${evt.tokens_in} in / ${evt.tokens_out} out | Cost: $${evt.cost_usd.toFixed(5)}
            </div>
          `;
          payloadContent = payload.text || JSON.stringify(payload);
        } else if (type === 'tool_call_started') {
          headerText = `TOOL CALL STARTED: ${payload.tool}`;
          payloadContent = JSON.stringify(payload.args, null, 2);
        } else if (type === 'tool_call_completed') {
          headerText = `TOOL CALL COMPLETED: ${payload.tool}`;
          payloadContent = typeof payload.output === 'string' ? payload.output : JSON.stringify(payload.output, null, 2);
        } else if (type === 'tool_call_failed') {
          headerText = `TOOL CALL FAILED: ${payload.tool}`;
          payloadContent = payload.error;
        } else if (type === 'state_transition') {
          headerText = `STATE TRANSITION`;
          payloadContent = `${payload.from} → ${payload.to}`;
        } else if (type === 'human_intervention') {
          headerText = `HUMAN INTERVENTION REQUIRED`;
          payloadContent = `Tool: ${payload.tool}\nMissing Roles: ${JSON.stringify(payload.missing_roles)}\nExpires: ${payload.expires_at || 'Never'}`;
        } else {
          payloadContent = JSON.stringify(payload, null, 2);
        }

        const nodeLabel = evt.node ? `<span class="timeline-node">${evt.node}</span>` : '';

        item.innerHTML = `
          <div class="timeline-time">${date}</div>
          <div class="timeline-content">
            <div class="timeline-title">${headerText} ${nodeLabel}</div>
            ${payloadContent ? `<pre class="timeline-payload">${payloadContent}</pre>` : ''}
            ${extraInfo}
          </div>
        `;
        timeline.appendChild(item);
      });
    }

    async function approveRun() {
      if (!currentRunId || !pendingTool) return;
      const role = document.getElementById('approval-role').value;

      try {
        const res = await fetch(`/api/runs/${currentRunId}/approve`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            tool: pendingTool,
            role: role
          })
        });

        const result = await res.json();
        if (result.success) {
          alert('Approval recorded! You can now resume the agent run.');
          loadRuns();
        } else {
          alert('Failed to approve: ' + result.error);
        }
      } catch (err) {
        alert('Error sending approval: ' + err);
      }
    }

    // Initialize
    loadRuns();
    // Auto-refresh runs list every 5 seconds
    setInterval(loadRuns, 5000);
  </script>
</body>
</html>
